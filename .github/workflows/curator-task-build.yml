name: Curator task build and validation (fork only)

# Curator-only helper for building and validating one task on GitHub-hosted
# linux/amd64 runners. Lives only on fork branches named curator/*; it is not
# part of any upstream pull request.
on:
  push:
    branches:
      - "curator/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: curator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TASK_NAME: vllm-trimmed-video-frame-sampling
      TARGET_PLATFORM: linux/amd64
      HARBOR_VERSION: 0.22.0
      EVIDENCE: ${{ github.workspace }}/evidence
      HARBOR_JOBS_DIR: ${{ github.workspace }}/harbor-jobs
      REPEATS: "3"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /
          nproc; free -h

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Harbor
        run: |
          set -euxo pipefail
          python -m pip install "harbor==${HARBOR_VERSION}"
          harbor --version

      - name: Reuse the image named by a committed manifest, if published
        id: reuse
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE"
          manifest="tasks/$TASK_NAME/environment/image-manifest.json"
          if [ -f "$manifest" ] && python3 tools/normalize_image_manifests.py --check; then
            key=$(python3 .github/scripts/task_ci.py env-key --task "$TASK_NAME" --platform "$TARGET_PLATFORM")
            repo=$(printf 'ghcr.io/%s/ai-infra-bench-task-envs' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            if docker pull "$repo:$TASK_NAME-$key"; then
              want=$(jq -r .image_id "$manifest")
              got=$(docker image inspect --format '{{.Id}}' "$repo:$TASK_NAME-$key")
              if [ "$want" = "$got" ]; then
                docker tag "$got" "curator/$TASK_NAME:build"
                echo "reused $repo:$TASK_NAME-$key ($got)" | tee "$EVIDENCE/build-reused.txt"
                echo "hit=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "published image $got does not match manifest $want; rebuilding" >&2
            fi
          fi
          echo "hit=false" >> "$GITHUB_OUTPUT"

      - name: Build image (empty-equivalent context, same command as task CI)
        if: steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          task_dir="tasks/$TASK_NAME"
          start=$(date +%s)
          docker buildx build --load --progress=plain \
            --tag "curator/$TASK_NAME:build" \
            --file "$task_dir/environment/Dockerfile" \
            "$task_dir/environment" 2>&1 | tee "$EVIDENCE/build.log"
          echo "build_seconds=$(( $(date +%s) - start ))" | tee "$EVIDENCE/build-time.txt"

      - name: Record image manifest from the real build
        run: |
          set -euo pipefail
          task_dir="tasks/$TASK_NAME"
          image_id=$(docker image inspect --format '{{.Id}}' "curator/$TASK_NAME:build")
          if [ "${{ steps.reuse.outputs.hit }}" != "true" ]; then
          python3 - "$task_dir" "$image_id" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from normalize_image_manifests import normalize_manifest
          task, image_id = Path(sys.argv[1]), sys.argv[2]
          env = task / "environment"
          files = {rel: hashlib.sha256((env / rel).read_bytes()).hexdigest()
                   for rel in ("Dockerfile", "lock/requirements.txt", "lock/manifest.json")}
          manifest = normalize_manifest({"image_id": image_id, "files": files})
          (env / "image-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY
          fi
          cp "$task_dir/environment/image-manifest.json" "$EVIDENCE/"
          python3 tools/normalize_image_manifests.py --check
          python3 .github/scripts/task_ci.py validate "$TASK_NAME"
          key=$(python3 .github/scripts/task_ci.py env-key --task "$TASK_NAME" --platform "$TARGET_PLATFORM")
          repo=$(printf 'ghcr.io/%s/ai-infra-bench-task-envs' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          ref="$repo:$TASK_NAME-$key"
          docker tag "curator/$TASK_NAME:build" "$ref"
          docker push "$ref" | tee "$EVIDENCE/push.log"
          printf '{"image_id":"%s","ref":"%s","env_key":"%s"}\n' "$image_id" "$ref" "$key" | tee "$EVIDENCE/image.json"
          echo "IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$ref" >> "$GITHUB_ENV"

      - name: Audit image layers, filesystem and Git isolation
        run: |
          set -euo pipefail
          docker history --no-trunc "$IMAGE_ID" > "$EVIDENCE/docker-history.txt"
          docker image inspect "$IMAGE_ID" > "$EVIDENCE/docker-inspect.json"
          if grep -Eiq 'trimmed|oracle\.patch|ci-cases|validation/patches|/tests/|/solution' "$EVIDENCE/docker-history.txt"; then
            echo "curator material referenced in image history" >&2; exit 1
          fi
          python3 .github/scripts/task_ci.py image-check --task "$TASK_NAME" --image "$IMAGE_ID" | tee "$EVIDENCE/image-check.json"
          docker run --rm --network none --entrypoint bash "$IMAGE_ID" -lc '
            set -u
            echo "--- curator-material scan"
            find / -xdev \( -iname "*trimmed*" -o -name "oracle.patch" -o -name "ci-cases.json" \
              -o -name "videolab.py" -o -name "test_trimmed_video.py" -o -name "*.orig" -o -name "*.rej" \) \
              -not -path "/proc/*" 2>/dev/null | head -50
            for p in /tests /solution /validation /logs/verifier; do test -e "$p" && echo "PRESENT $p"; done
            echo "--- git"
            cd /workspace/vllm && git -c safe.directory=/workspace/vllm log -1 --format="%H %cI" \
              && git -c safe.directory=/workspace/vllm rev-list --all --count \
              && git -c safe.directory=/workspace/vllm count-objects -v \
              && ls .git/objects/pack | head
            echo "--- future source check"
            git -c safe.directory=/workspace/vllm cat-file -e 9b2aef512440f024fc98cd0ac954cd452613ad5b 2>/dev/null && echo "FUTURE COMMIT PRESENT" || echo "future fix commit absent"
            grep -n "presentable" /workspace/vllm/vllm/multimodal/video_decoders/*.py || echo "no fix text in decoders"
            echo "--- tools"
            ffmpeg -version | head -1; ffprobe -version | head -1
            python -c "import cv2, av, numpy, torch; print(\"cv2\", cv2.__version__, \"av\", av.__version__, \"numpy\", numpy.__version__, \"torch\", torch.__version__)"
            python -c "import torchcodec; print(\"torchcodec\", torchcodec.__version__)" || true
            python -c "import pytest; print(\"pytest\", pytest.__version__)"
            id nobody; command -v setpriv; whoami
          ' 2>&1 | tee "$EVIDENCE/filesystem-audit.txt"

      - name: Smoke test as the agent user (root) with no network
        run: |
          set -uo pipefail
          docker run --rm --network none --user root --entrypoint bash "$IMAGE_ID" -lc '
            cd /workspace/vllm
            timeout 1800 python -m pytest -q -p no:cacheprovider tests/multimodal/test_video.py \
              -k "broken_frames or recovery or opencv" 2>&1 | tail -25
          ' 2>&1 | tee "$EVIDENCE/smoke-upstream-tests.txt"

      - name: Reproduce the statement example inside the image (curator probe)
        run: |
          set -euo pipefail
          docker run --rm --network none --user root \
            --mount "type=bind,src=$PWD/curator,dst=/curator,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint bash "$IMAGE_ID" -lc \
            'cd /tmp && python /curator/instruction_probe.py /evidence/instruction-probe.json' \
            2>&1 | tail -60

      - name: Fixture construction probe (curator)
        run: |
          set -euo pipefail
          docker run --rm --network none --user root \
            --mount "type=bind,src=$PWD/curator,dst=/curator,readonly" \
            --mount "type=bind,src=$PWD/tasks/$TASK_NAME/tests,dst=/probe-tests,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint bash "$IMAGE_ID" -lc \
            'cd /tmp && python -I /curator/fixture_probe.py /probe-tests /evidence/fixture-probe.json' \
            | tee "$EVIDENCE/fixture-probe.txt"

      - name: VFR fixture recipe variants (curator)
        run: |
          set -euo pipefail
          docker run --rm --network none --user root \
            --mount "type=bind,src=$PWD/curator,dst=/curator,readonly" \
            --mount "type=bind,src=$PWD/tasks/$TASK_NAME/tests,dst=/probe-tests,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint bash "$IMAGE_ID" -lc \
            'cd /tmp && python -I /curator/vfr_variants_probe.py /probe-tests /evidence/vfr-variants.json' \
            | tee "$EVIDENCE/vfr-variants.txt"

      - name: OpenCV stream-capture release() crash probe (curator)
        run: |
          set -euo pipefail
          docker run --rm --network none --user root \
            --mount "type=bind,src=$PWD/curator,dst=/curator,readonly" \
            --mount "type=bind,src=$EVIDENCE,dst=/evidence" \
            --entrypoint bash "$IMAGE_ID" -lc \
            'cd /tmp && python /curator/opencv_release_probe.py /evidence/opencv-release-probe.json'

      - name: Run every declared case through Harbor (task CI script)
        if: hashFiles('curator/PROBE_ONLY') == ''
        env:
          AI_INFRA_LOCAL_IMAGE: ${{ env.IMAGE_ID }}
          PUBLISH_IMAGE: "false"
        run: |
          set -o pipefail
          bash .github/scripts/run_task_validation.sh 2>&1 | tee "$EVIDENCE/task-validation.log"

      - name: Repeat Base, Oracle, alternative and crash controls through Harbor
        if: always() && hashFiles('curator/PROBE_ONLY') == ''
        run: |
          set -uo pipefail
          for i in $(seq 2 "$REPEATS"); do
            for case in base oracle alternative-decode-count oracle-segfault-mid-run oracle-segfault-at-exit; do
              dir=$(mktemp -d)
              agent=$(python3 .github/scripts/task_ci.py prepare-case --task "$TASK_NAME" --image "$IMAGE_ID" --case "$case" --output "$dir")
              expected=$(python3 .github/scripts/task_ci.py cases --task "$TASK_NAME" | jq -r --arg c "$case" '.[] | select(.name == $c) | .expected_reward')
              job="$TASK_NAME--$case-repeat-$i"
              harbor run --path "$dir" --agent "$agent" --env docker --jobs-dir "$HARBOR_JOBS_DIR/$TASK_NAME" \
                --job-name "$job" --n-concurrent 1 --cpus limit --memory limit --override-cpus 4 --delete --yes \
                2>&1 | tail -20
              python3 .github/scripts/task_ci.py check-result --result "$HARBOR_JOBS_DIR/$TASK_NAME/$job/result.json" \
                --expected-reward "$expected" 2>&1 | tee -a "$EVIDENCE/repeats.log"
            done
          done

      - name: Summarize rewards
        if: always()
        run: |
          set -uo pipefail
          for r in "$HARBOR_JOBS_DIR"/"$TASK_NAME"/*/result.json; do
            job=$(basename "$(dirname "$r")")
            printf '%s ' "$job"; jq -c '{reward: (.stats.evals // .verifier_result // .rewards // . | tostring | .[0:300])}' "$r" 2>/dev/null || echo unreadable
          done | tee "$EVIDENCE/rewards-summary.txt"
          find "$HARBOR_JOBS_DIR" -name reward.json -exec sh -c 'echo "$1: $(cat "$1")"' _ {} \; | tee -a "$EVIDENCE/rewards-summary.txt"
          sudo chown -R "$(id -u):$(id -g)" "$HARBOR_JOBS_DIR" || true

      - name: Upload evidence and Harbor job records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-evidence-${{ github.run_id }}
          path: |
            evidence/
            harbor-jobs/
          retention-days: 30
